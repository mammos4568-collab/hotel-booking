# ============================================================
# รันแบบ production บนเครื่องเดียว: PostgreSQL + แอป (API + หน้าเว็บใน container เดียว)
#
#   1) copy .env.production.example .env.production   แล้วตั้งรหัสผ่าน/JWT_SECRET จริง
#   2) docker compose -f docker-compose.prod.yml --env-file .env.production up -d --build
#   3) เปิด http://localhost:8080
#
# ขึ้น VPS จริงด้วย HTTPS: ตั้ง PUBLIC_URL=https://<โดเมน> + TRUST_PROXY=1 แล้วเพิ่ม --profile https
#   (เปิด Caddy ที่พอร์ต 80/443 ทำ HTTPS ให้เอง) — ขั้นตอนเต็มดู docs/deploy-vps.md
#
# ชื่อ project แยกจาก docker-compose.yml (ตอนพัฒนา) → ฐานข้อมูล/volume ไม่ปนกัน
# ============================================================
name: hotel-booking-prod

services:
  db:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-agoda_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?ต้องตั้ง POSTGRES_PASSWORD ใน .env.production}
      POSTGRES_DB: ${POSTGRES_DB:-agoda_db}
    volumes:
      - db_data:/var/lib/postgresql/data
      # สร้างตาราง + ข้อมูลตัวอย่างอัตโนมัติ "ครั้งแรก" ที่ volume ยังว่าง (01 → 08 ตามลำดับชื่อไฟล์)
      - ./db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20
    # ไม่เปิดพอร์ตฐานข้อมูลออกนอกเครื่อง — มีแค่แอปที่คุยกับฐานข้อมูลผ่าน network ภายในของ compose

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy # รอฐานข้อมูลพร้อมก่อนค่อยเปิดแอป
    environment:
      DATABASE_URL: postgres://${POSTGRES_USER:-agoda_admin}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-agoda_db}
      JWT_SECRET: ${JWT_SECRET:?ต้องตั้ง JWT_SECRET (อย่างน้อย 32 ตัวอักษร) ใน .env.production}
      # ต้องตรงกับ URL ที่ผู้ใช้เปิดเว็บ (ใช้ตรวจ CORS และเป็นปลายทางหลังล็อกอินผ่าน Google/GitHub)
      CLIENT_URL: ${PUBLIC_URL:-http://localhost:8080}
      TRUST_PROXY: ${TRUST_PROXY:-}
      # เข้าสู่ระบบด้วย Google / GitHub — ช่องไหนเว้นว่าง = ปิดช่องทางนั้น (กดแล้วหน้าเว็บบอกว่ายังไม่เปิด)
      # callback ต่อจาก PUBLIC_URL ให้เอง เพราะ production เสิร์ฟหน้าเว็บและ API จากโดเมนเดียวกัน
      # → ต้องลงทะเบียน <PUBLIC_URL>/api/auth/<google|github>/callback ไว้กับแต่ละเจ้าให้ตรงกัน
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_CALLBACK_URL: ${PUBLIC_URL:-http://localhost:8080}/api/auth/google/callback
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      GITHUB_CALLBACK_URL: ${PUBLIC_URL:-http://localhost:8080}/api/auth/github/callback
      # Opn Payments (TrueMoney) — เว้นว่าง = ชำระเงินแบบจำลอง · ตั้ง webhook ใน dashboard ของ Opn เป็น
      # <PUBLIC_URL>/api/bookings/gateway/webhook (สำคัญตอนลูกค้าจ่ายแล้วไม่ได้กลับมาหน้าเว็บ)
      OMISE_SECRET_KEY: ${OMISE_SECRET_KEY:-}
      OMISE_PUBLIC_KEY: ${OMISE_PUBLIC_KEY:-}
    ports:
      # ผูกกับ 127.0.0.1 = เปิดได้จากเครื่องนี้เท่านั้น (http://localhost:8080) คนนอกเข้าทาง Caddy (https) อย่างเดียว
      # สำคัญบน Linux: พอร์ตที่ Docker เปิดแบบ 0.0.0.0 ทะลุ firewall (ufw) ได้ → http ธรรมดาจะหลุดออกอินเทอร์เน็ต
      - "127.0.0.1:${APP_PORT:-8080}:3000"

  # HTTPS บน VPS — ทำงานเฉพาะตอนสั่ง --profile https (รันบนเครื่องตัวเองแบบปกติจะไม่มี container นี้)
  caddy:
    image: caddy:2-alpine
    profiles: ["https"]
    restart: unless-stopped
    depends_on:
      - app
    environment:
      # Caddyfile อ่านโดเมนจาก PUBLIC_URL (ต้องขึ้นต้น https:// และไม่มี / ท้าย) — ค่าเดียวกับที่แอปใช้
      PUBLIC_URL: ${PUBLIC_URL:-}
    ports:
      - "80:80"       # ใช้ยืนยันว่าเป็นเจ้าของโดเมนตอนขอใบรับรอง + redirect http → https
      - "443:443"
      - "443:443/udp" # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # ใบรับรองต้องเก็บไว้ใน volume — ไม่งั้นขอใหม่ทุกครั้งที่สร้าง container ใหม่ (Let's Encrypt จำกัดจำนวนครั้งต่อสัปดาห์)
      - caddy_data:/data
      - caddy_config:/config

volumes:
  db_data:
  caddy_data:
  caddy_config:
